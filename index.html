<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SonKullan+</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥬</text></svg>">

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaf0ef; --kart:#ffffff; --ink:#1f2a2e; --mut:#5d6a6e; --cizgi:#d3dddc;
  --acc:#1f5e5b; --acc-ink:#ffffff; --acc-soft:#d6e8e5;
  --kirmizi:#c8372d; --kirmizi-bg:#fbe7e4; --sari:#a8700a; --sari-bg:#fbf0d6;
  --yesil:#3f7d4e; --yesil-bg:#e2f0e5; --gri:#7d878a; --gri-bg:#e7ebeb;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a1c; --kart:#1b2528; --ink:#e6eeee; --mut:#9fb0b2; --cizgi:#2c3a3d;
  --acc:#6cc3b8; --acc-ink:#0d1a19; --acc-soft:#1f3634;
  --kirmizi:#f0897c; --kirmizi-bg:#3a1e1b; --sari:#e9be5d; --sari-bg:#352a12;
  --yesil:#82c494; --yesil-bg:#1b2f21; --gri:#9aa5a7; --gri-bg:#253033;
  color-scheme:dark;
}}
:root[data-theme="dark"]{--bg:#121a1c; --kart:#1b2528; --ink:#e6eeee; --mut:#9fb0b2; --cizgi:#2c3a3d;
  --acc:#6cc3b8; --acc-ink:#0d1a19; --acc-soft:#1f3634;
  --kirmizi:#f0897c; --kirmizi-bg:#3a1e1b; --sari:#e9be5d; --sari-bg:#352a12;
  --yesil:#82c494; --yesil-bg:#1b2f21; --gri:#9aa5a7; --gri-bg:#253033;
  color-scheme:dark;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Rubik,system-ui,-apple-system,"Segoe UI",sans-serif}
.kap{max-width:600px;margin:0 auto;padding:16px 14px 96px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:4px 2px 14px}
h1{font-size:26px;margin:0;font-weight:700;letter-spacing:-.5px;color:var(--acc)}
h2{font-size:19px;margin:0 0 10px;font-weight:700}
h3{font-size:16px;margin:0 0 6px;font-weight:700}
.alt{color:var(--mut);font-size:14px}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:14px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--cizgi);background:var(--kart);color:var(--ink);padding:9px 14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.ana{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:500}
button.buyuk{width:100%;padding:14px;font-size:17px}
button.kucuk{padding:5px 10px;font-size:14px}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--cizgi);border-radius:9px;padding:8px 10px;width:100%}
label{display:block;font-size:14px;color:var(--mut);margin:8px 0 3px}
.ızgara{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.satir{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--kart);border-top:1px solid var(--cizgi);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;max-width:150px;border:0;border-radius:0;padding:12px 4px;font-size:14px;color:var(--mut);background:none;position:relative}
nav button[aria-current="true"]{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
.rozet{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--kirmizi);color:#fff;font-size:12px;margin-left:4px}
/* Ürün kartı: tazelik çubuğu uygulamanın imzası */
.urun{display:grid;grid-template-columns:8px 1fr;background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;margin-bottom:8px;overflow:hidden}
.cubuk{background:var(--gri)}
.urun.kirmizi .cubuk{background:var(--kirmizi)} .urun.sari .cubuk{background:var(--sari)}
.urun.yesil .cubuk{background:var(--yesil)} .urun.belirsiz .cubuk{background:repeating-linear-gradient(180deg,var(--gri) 0 6px,transparent 6px 12px)}
.urun-ic{padding:10px 12px}
.urun-ust{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.urun-ad{font-weight:500}
.durum{font-size:14px;font-weight:500;white-space:nowrap}
.kirmizi .durum{color:var(--kirmizi)} .sari .durum{color:var(--sari)} .yesil .durum{color:var(--yesil)} .gri .durum,.belirsiz .durum{color:var(--gri)}
.meta{font-size:13px;color:var(--mut);margin-top:2px}
.etiket{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;background:var(--gri-bg);color:var(--mut);margin:4px 4px 0 0}
.etiket.demo{background:var(--sari-bg);color:var(--sari)}
.etiket.kesin{background:var(--acc-soft);color:var(--acc)}
.uyari{background:var(--kirmizi-bg);color:var(--kirmizi);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.bilgi{background:var(--acc-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.acil{background:var(--kirmizi-bg);border:1px solid var(--kirmizi);border-radius:14px;padding:14px;margin-bottom:12px}
.acil strong{color:var(--kirmizi)}
.ozet{display:flex;gap:6px;margin-bottom:12px}
.ozet div{flex:1;text-align:center;border-radius:10px;padding:8px 2px;font-size:13px}
.ozet b{display:block;font-size:20px}
.o-k{background:var(--kirmizi-bg);color:var(--kirmizi)} .o-s{background:var(--sari-bg);color:var(--sari)} .o-y{background:var(--yesil-bg);color:var(--yesil)} .o-g{background:var(--gri-bg);color:var(--gri)}
.cip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--cizgi);border-radius:20px;padding:5px 11px;font-size:14px;margin:3px 4px 3px 0;cursor:pointer;background:var(--kart)}
.cip[aria-pressed="true"]{background:var(--kirmizi-bg);border-color:var(--kirmizi);color:var(--kirmizi)}
.tarif h3{font-size:18px}
.tarif ol{padding-left:20px;margin:6px 0} .tarif li{margin-bottom:4px}
.malz{margin:4px 0 8px;padding-left:0;list-style:none}
.malz li{font-size:15px;padding:2px 0}
.denetim{font-size:14px;border-radius:10px;padding:8px 10px;margin-top:8px;background:var(--yesil-bg);color:var(--yesil)}
.denetim.kaldi{background:var(--kirmizi-bg);color:var(--kirmizi)}
details summary{cursor:pointer;font-size:14px;color:var(--mut)}
pre{white-space:pre-wrap;word-break:break-word;font-size:12.5px;background:var(--bg);border-radius:8px;padding:8px;max-height:280px;overflow:auto}
.ilerleme{font-size:14px;color:var(--mut)} .ilerleme div::before{content:"• "}
.dipnot{font-size:13px;color:var(--mut);margin-top:16px}
.dosya{display:none}
@media (prefers-reduced-motion:no-preference){.urun{transition:background .2s}}
header{align-items:flex-start}
header h1{line-height:1.1}
.dil{display:flex;border:1px solid var(--cizgi);border-radius:9px;overflow:hidden;flex-shrink:0}
.dil button{border:0;border-radius:0;padding:6px 10px;font-size:14px;background:var(--kart);color:var(--mut)}
.dil button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);font-weight:500}
details.belirti{margin-top:6px}
details.belirti summary{font-size:13px}
code{font-size:12.5px;word-break:break-word}
nav button{font-size:13px}
</style>
</head>

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const norm = s => String(s ?? "").toLocaleLowerCase("tr").trim();
function ymd(d){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());}
const bugun = () => ymd(new Date());
function gunEkle(s,n){const [y,m,d]=s.split("-").map(Number);return ymd(new Date(y,m-1,d+n));}
function gunFarki(s){if(!s)return null;const [y,m,d]=s.split("-").map(Number);const b=new Date();b.setHours(0,0,0,0);return Math.round((new Date(y,m-1,d)-b)/86400000);}
const gTarih = s => { if(!s) return "—"; const [y,m,d]=s.split("-"); return LANG==="en" ? `${d}/${m}/${y}` : `${d}.${m}.${y}`; };
const okTarih = s => /^\d{4}-\d{2}-\d{2}$/.test(s||"") ? s : null;
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const HARF = "a-zçğıöşüâîûéè0-9";
function kelimeVar(metin,k){
  if(!k) return false; let tam=false; k=norm(k); if(k.endsWith("$")){ tam=true; k=k.slice(0,-1); }
  let m = norm(metin); ALERJEN_ISTISNA.forEach(x=>{ m = m.split(x).join(" "); });
  return new RegExp("(^|[^"+HARF+"])"+reEsc(k)+(tam?"($|[^"+HARF+"])":""),"u").test(m);
}
const temizK = k => k.replace(/\$$/,"");
function benzer(a,b){ a=norm(a); b=norm(b); if(!a||!b) return false; if(a.includes(b)||b.includes(a)) return true; const x=a.split(/\s+/)[0]; return x===b.split(/\s+/)[0] && x.length>3; }
function parseJSON(tx){
  let s=String(tx||"").replace(/```json|```/g,"").trim();
  const i=s.search(/[\[{]/); if(i<0) throw new Error("JSON?");
  const j=s.lastIndexOf(s[i]==="{"?"}":"]"); return JSON.parse(s.slice(i,j+1));
}

function durum(it){
  if(!it.onayli) return {renk:"gri",etiket:t("dOnay"),uygun:false,neden:t("nOnay")};
  const d = gunFarki(it.tarih);
  if(d===null) return {renk:"belirsiz",etiket:t("dSureYok"),uygun:true,yan:true,d:null};
  if(d<0){
    if(it.tur==="STT") return {renk:"gri",etiket:t("dSTT",-d),uygun:false,neden:t("nSTT"),d};
    const et = it.tur==="TETT" ? t("dTETT",-d) : t("dTablo",-d);

function resimOku(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const max=1568, s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg",0.85).split(",")[1]); };
    img.onerror=()=>rej(new Error(t("gorselAcilmadi")));
    img.src=url;
  });
}
async function callAI({amac,teknik,system,content,images}){
  const t0=Date.now(); let metin="", hata=null;
  try{
    const image = images ? {mime:"image/jpeg", data: await resimOku(images)} : null;
    const r = await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system,prompt:content,image})});
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(r.status===429 ? t("kota") : (d.error || t("sunucu",r.status)));
    metin = d.text || "";
  }catch(e){ hata = e.message || String(e); }
  S.log.unshift({id:uid(),zaman:new Date().toLocaleString(yerel()),amac,teknik,system,prompt:content+(images?"\n\n[+ photo]":""),cikti:hata?("ERROR: "+hata):metin,sure:((Date.now()-t0)/1000).toFixed(1),not:""});
  S.log = S.log.slice(0,40); kaydet();
  if(hata) throw new Error(hata);
  return metin;
}

function kurtarBaglam(kisi, alerjenler, istStr){
  const ist = istStr.split(",").map(norm).filter(Boolean);
  const izinli=[], disarida=[];
  aktifUrunler().forEach(it=>{ const du=durum(it);
    if(!du.uygun){ disarida.push({ad:it.ad,neden:du.neden}); return; }
    const al=urunAlerjen(it,alerjenler); if(al){ disarida.push({ad:it.ad,neden:t("nAlerjen",al)}); return; }
    if(ist.some(k=>kelimeVar(it.ad,k))){ disarida.push({ad:it.ad,neden:t("nIst")}); return; }
    izinli.push({...it,_d:du}); });
  izinli.sort((a,b)=>(a._d.d??9999)-(b._d.d??9999));
  let capa = izinli.filter(i=>!i._d.yan && (i._d.renk==="kirmizi"||i._d.renk==="sari")).slice(0,2), acilYok=false;
  if(!capa.length){ capa = izinli.filter(i=>!i._d.yan).slice(0,1); acilYok=true; }
  const yan = izinli.filter(i=>!capa.includes(i));
  const kiler = S.hane.kiler.split(",").map(s=>s.trim()).filter(Boolean).filter(k=>!alerjenler.some(a=>ALERJEN[a].kelimeler.some(w=>kelimeVar(k,w))));
  const disaridaKontrol = disarida.filter(d=>!izinli.some(i=>benzer(i.ad,d.ad)));
  return {kisi,alerjenler,ist,izinli,disarida,disaridaKontrol,capa,yan,kiler,acilYok,carpan:S.hane.carpan};
}
function kodDenetim(r, c){
  if(!r || !r.ad || !Array.isArray(r.malzemeler) || !Array.isArray(r.adimlar)) return [t("vFormat")];
  const v=[];
  r.malzemeler.forEach(m=>{
    if(m.kaynak==="dolap" && !c.izinli.some(i=>benzer(i.ad,m.ad))) v.push(t("vDolapYok",m.ad));
    if(m.kaynak==="kiler" && !c.kiler.some(k=>benzer(k,m.ad))) m.kaynak="ek";
  });
  const metin = [r.ad, r.gerekce, ...r.malzemeler.map(m=>m.ad), ...r.adimlar].join(" ");
  c.alerjenler.forEach(a=>ALERJEN[a].kelimeler.forEach(k=>{ if(kelimeVar(metin,k)) v.push(t("vAlerjen",temizK(k),alerjenAd(a))); }));
  c.ist.forEach(k=>{ if(kelimeVar(metin,k)) v.push(t("vIst",k)); });
  c.disaridaKontrol.forEach(d=>{ if(kelimeVar(metin,d.ad)) v.push(t("vDis",d.ad,d.neden)); });
  YASAK_IFADE.forEach(k=>{ if(norm(metin).includes(k)) v.push(t("vIddia",k)); });
  if(!r.malzemeler.some(m=>m.kaynak==="dolap" && c.capa.some(x=>benzer(x.ad,m.ad)))) v.push(t("vCapa"));
  return [...new Set(v)];
}
async function tarifTur(yontemler, c, geriMap, ilerle, tur){
  ilerle(t("tur1",tur,yontemler.length));
  const j = parseJSON(await callAI({amac:t("amTarif",tur),teknik:TK_TARIF,system:SYS_TARIF,content:tarifPrompt(yontemler,c,geriMap)}));
  const liste = Array.isArray(j.tarifler) ? j.tarifler : [];
  const sonuc = yontemler.map((y,i)=>{ const r = liste.find(x=>x && norm(x.yontem)===norm(y)) || liste[i]; return {yontem:y,tarif:r,kod:kodDenetim(r,c),deneme:tur,gecti:false}; });
  const kodKalan = sonuc.filter(s=>s.kod.length).length;
  if(kodKalan) ilerle(t("turKod",tur,kodKalan));
  const aday = sonuc.filter(s=>!s.kod.length);
  if(aday.length){
    ilerle(t("turDen",tur,aday.length));
    let dz; try{ dz = parseJSON(await callAI({amac:t("amDen",tur),teknik:TK_DEN,system:SYS_DENETCI,content:denetciPrompt(aday.map(s=>s.tarif),c)})); }catch(e){ dz={sonuclar:[]}; }
    aday.forEach((s,i)=>{
      const d = (dz.sonuclar||[]).find(x=>Number(x.index)===i);
      s.denetci = d || {gecti:false,kontroller:[{kod:"—",sonuc:"KALDI",kanit:t("denYanitYok")}]};
      const kalan = (s.denetci.kontroller||[]).filter(k=>norm(k.sonuc).startsWith("kal"));
      s.gecti = s.denetci.gecti===true && !kalan.length;
      s.denetciSorun = kalan.length ? kalan.map(k=>`${k.kod}: ${k.kanit}`) : (s.gecti?[]:[t("denOnaylamadi")]);
    });
  }
  return sonuc;
}
async function kurtar(){
  const kisi = Math.max(1, Math.min(12, parseInt(document.getElementById("kisi").value)||S.hane.kisi));
  const istStr = document.getElementById("ist").value || "";
  S.hane.kisi = kisi; kaydet();
  UI.kurtarHata="";
  const gm = guvenlikKontrol([istStr, S.hane.kiler, ...aktifUrunler().map(i=>i.ad)]);
  if(gm){ UI.kurtarHata=gm; render(); return; }
  if(istStr.length>300 || S.hane.kiler.length>500){ UI.kurtarHata=t("gUzun"); render(); return; }
  const c = kurtarBaglam(kisi, S.hane.alerjenler, istStr);
  if(!c.capa.length){ UI.kurtarHata=t("kUrunYok"); render(); return; }
  UI.kurtarCalisiyor=true; UI.ilerleme=[]; UI.pisirilen={}; render();
  const ilerle = m => { UI.ilerleme.push(m); render(); };
  const yontemler = YONTEMLER[LANG];
  try{
    const sonuc = await tarifTur(yontemler, c, null, ilerle, 1);
    const kalan = sonuc.filter(s=>!s.gecti);
    if(kalan.length){
      const geriMap = {}; kalan.forEach(s=>{ geriMap[s.yontem] = s.kod.length ? s.kod : s.denetciSorun; });
      ilerle(t("turTekrar",kalan.length));
      try{
        const ikinci = await tarifTur(kalan.map(s=>s.yontem), c, geriMap, ilerle, 2);
        ikinci.forEach(n=>{ n.onceki = geriMap[n.yontem]; sonuc[sonuc.findIndex(s=>s.yontem===n.yontem)] = n; });
      }catch(e){ kalan.forEach(s=>{ s.hata = t("tekrarHata", e.message); }); }
    }
    S.sonKurtar = { zaman:new Date().toLocaleString(yerel()), kisi, capa:c.capa.map(i=>i.ad), disarida:c.disarida, acilYok:c.acilYok, carpan:c.carpan, sonuclar:sonuc };
  }catch(e){ UI.kurtarHata = e.message; }
  UI.kurtarCalisiyor=false; kaydet(); render();
}

  const kutu=(sayi,et,cls)=>`<div class="${cls}"><b>${sayi}</b>${et}</div>`;
  return `<div class="kart"><h2>${t("eBaslik")}</h2><p class="alt">${t("eAlt")}</p>
    ${top||e.pisen?`<div class="ozet">${kutu(e.kullanilan,t("eKurtarilan"),"o-y")}${kutu(e.atilan,t("eAtilan"),"o-k")}${kutu(oran==null?"—":oran+"%",t("eOran"),"o-s")}</div>
    <div class="ozet">${kutu(e.tarifle,t("eTarif"),"o-g")}${kutu(e.pisen,t("ePisen"),"o-g")}</div>
    <p style="font-size:14px"><b>${t("eGeri")}:</b> ${t("tam")} ${say("tam")} · ${t("artti")} ${say("artti")} · ${t("yetmedi")} ${say("yetmedi")} · ${t("carpanKisa")} ${S.hane.carpan.toFixed(2)}</p>`:`<p class="alt">${t("eBos")}</p>`}
    <p class="dipnot">${t("eOranNot")}</p><p class="dipnot">${t("eNeden")} ${t("eDemo")}</p>
    <button class="kucuk" data-act="etkiSifirla">${t("eSifirla")}</button></div>`;
}
function vLog(){
  return `<div class="kart"><h2>${t("logBaslik")}</h2><p class="alt">${t("logAlt")}</p>
      <div class="satir"><button data-act="logDisa">${t("logJson")}</button><button data-act="logSil">${t("logTemizle")}</button></div><div id="logDisa"></div></div>
    <div class="kart"><h3>${t("gBaslik")}</h3><p class="alt">${t("gAlt")}</p>${S.guvenlik.length?`<ul>${S.guvenlik.map(g=>`<li><span class="meta">${esc(g.zaman)}</span> — ${esc(t("gTur")[g.tur])}: <code>${esc(g.girdi)}</code></li>`).join("")}</ul>`:`<p class="meta">${t("gBos")}</p>`}</div>
    ${S.log.length?S.log.map(l=>`<div class="kart"><h3>${esc(l.amac)}</h3><div class="meta">${esc(l.zaman)} · ${esc(l.sure)} ${t("sn")}</div>
      <p style="font-size:14px"><b>${t("teknik")}</b> ${esc(l.teknik)}</p>
      <details><summary>${t("sistem")}</summary><pre>${esc(l.system)}</pre></details>
      <details><summary>${t("kullanici")}</summary><pre>${esc(l.prompt)}</pre></details>
      <details><summary>${t("cikti")}</summary><pre>${esc(l.cikti)}</pre></details>
      <label>${t("logNot")}</label><textarea rows="2" data-log="${l.id}">${esc(l.not)}</textarea></div>`).join(""):`<div class="kart"><p class="alt">${t("logBos")}</p></div>`}`;
}
function render(){
  document.documentElement.lang = LANG;
  const sek=[["dolap","tabDolap"],["ekle","tabEkle"],["kurtar","tabKurtar"],["etki","tabEtki"],["log","tabLog"]];
  const acilSay = sirali().filter(x=>x.du.renk==="kirmizi").length;
  document.getElementById("nav").innerHTML = sek.map(([k,a])=>`<button data-act="tab" data-t="${k}" aria-current="${UI.tab===k}">${t(a)}${k==="dolap"&&acilSay?`<span class="rozet">${acilSay}</span>`:""}${k==="ekle"&&S.bekleyen.length?`<span class="rozet">${S.bekleyen.length}</span>`:""}</button>`).join("");
  const govde = {dolap:vDolap,ekle:vEkle,kurtar:vKurtar,etki:vEtki,log:vLog}[UI.tab]();
  document.getElementById("app").innerHTML = `<header><div><h1>SonKullan+</h1><span class="alt">${t("slogan")}</span></div>
    <div class="dil" role="group" aria-label="Language"><button data-act="dil" data-l="tr" aria-pressed="${LANG==="tr"}">TR</button><button data-act="dil" data-l="en" aria-pressed="${LANG==="en"}">EN</button></div></header>${govde}`;
}

/* ===================== OLAYLAR ===================== */
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="tab"){ UI.tab=b.dataset.t; render(); window.scrollTo(0,0); }
  else if(a==="dil") dilDegistir(b.dataset.l);
  else if(a==="demo") demoYukle();
  else if(a==="sil"){ S.items=S.items.filter(i=>i.id!==b.dataset.id); kaydet(); render(); }
  else if(a==="kullandim"){ const it=S.items.find(i=>i.id===b.dataset.id); if(it){ it.durum="kullanildi"; S.etki.kullanilan++; } kaydet(); render(); }
  else if(a==="attim"){ const it=S.items.find(i=>i.id===b.dataset.id); if(it){ it.durum="atildi"; S.etki.atilan++; } kaydet(); render(); }
  else if(a==="etkiSifirla"){ if(confirm(t("cEtki"))){ S.etki={kullanilan:0,atilan:0,tarifle:0,pisen:0}; S.geri=[]; kaydet(); render(); } }
  else if(a==="kontrol"){ const it=S.items.find(i=>i.id===b.dataset.id); if(it) it.kontrol=b.checked; kaydet(); render(); }
  else if(a==="hepsiniSil"){ if(confirm(t("cTemizle"))){ S.items=[]; kaydet(); render(); } }
  else if(a==="dosya"){ document.getElementById("dosya-"+b.dataset.t).click(); }
  else if(a==="sesli") sesliIsle();
  else if(a==="manuel"){
    const ad=document.getElementById("m-ad").value.trim(); if(!ad){ alert(t("aAdYaz")); return; }
    const tur=document.getElementById("m-tur").value, tarih=document.getElementById("m-tarih").value;
    if(tur!=="YOK" && !tarih){ alert(t("aSTTTarih")); return; }
    const gm=guvenlikKontrol([ad]); if(gm){ alert(gm); return; } if(ad.length>80){ alert(t("gUzun")); return; }
    S.items.push(kalemOlustur({ad,saklama:document.getElementById("m-sak").value,kategori:document.getElementById("m-kat").value,miktar:document.getElementById("m-mik").value,birim:document.getElementById("m-bir").value,alis:document.getElementById("m-alis").value||bugun(),tur,tarih,giris:"manuel"}));
    kaydet(); UI.tab="dolap"; render();
  }
  else if(a==="onayla"){
    const yeni=[];
    for(const k of document.querySelectorAll("[data-onay]")){
      if(!k.querySelector(".o-ekle").checked) continue;
      const dog=k.querySelector(".o-dog"), ad=k.querySelector(".o-ad").value.trim();
      if(dog && !dog.checked){ alert(t("aDogrula",ad||"?")); return; }
      const tur=k.querySelector(".o-tur").value, tarih=k.querySelector(".o-tarih").value;
      if(!ad){ alert(t("aAdBos")); return; }
      if(tur!=="YOK" && !tarih){ alert(t("aTarihYok",ad)); return; }
      yeni.push(kalemOlustur({ad,saklama:k.querySelector(".o-sak").value,kategori:k.querySelector(".o-kat").value,miktar:k.querySelector(".o-mik").value,birim:k.querySelector(".o-bir").value,alis:k.querySelector(".o-alis").value||bugun(),tur,tarih,giris:S.bekleyen[+k.dataset.onay]?.giris}));
    }
    S.items.push(...yeni); S.bekleyen=[]; kaydet(); UI.tab="dolap"; render();
  }
  else if(a==="bekleyenSil"){ S.bekleyen=[]; kaydet(); render(); }
  else if(a==="alerjen"){ const k=b.dataset.k; S.hane.alerjenler = S.hane.alerjenler.includes(k)?S.hane.alerjenler.filter(x=>x!==k):[...S.hane.alerjenler,k]; kaydet(); render(); }
  else if(a==="carpanSifirla"){ S.hane.carpan=1; kaydet(); render(); }
  else if(a==="kurtar") kurtar();
  else if(a==="pisirdim"){ UI.pisirilen[b.dataset.i]="sor"; S.etki.pisen++; kaydet(); render(); }
  else if(a==="geri"){
    const v=b.dataset.v, c=S.hane.carpan;
    S.hane.carpan = v==="artti" ? Math.max(0.7,c*0.9) : v==="yetmedi" ? Math.min(1.3,c*1.1) : c;
    S.geri.push({zaman:new Date().toISOString(),tarif:S.sonKurtar?.sonuclar[b.dataset.i]?.tarif?.ad,sonuc:v});
    UI.pisirilen[b.dataset.i] = t("tesekkur",S.hane.carpan.toFixed(2)); kaydet(); render();
  }
  else if(a==="dus"){
    const r=S.sonKurtar?.sonuclar[b.dataset.i]?.tarif; if(!r) return;
    const dusen=[]; aktifUrunler().forEach(it=>{ if(r.malzemeler.some(m=>m.kaynak==="dolap"&&benzer(it.ad,m.ad))){ it.durum="kullanildi"; dusen.push(it.ad); S.etki.kullanilan++; S.etki.tarifle++; } });
    UI.pisirilen[b.dataset.i] = dusen.length?t("dusuldu",dusen.join(", ")):t("eslesmeYok"); kaydet(); render();
  }
  else if(a==="logDisa"){ document.getElementById("logDisa").innerHTML=`<textarea rows="8" style="margin-top:8px" readonly>${esc(JSON.stringify(S.log,null,2))}</textarea>`; }
  else if(a==="logSil"){ if(confirm(t("cLog"))){ S.log=[]; kaydet(); render(); } }
});
document.addEventListener("keydown", e=>{ const b=e.target.closest(".cip"); if(b && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); b.click(); } });
document.addEventListener("input", e=>{ if(e.target.id==="ses") UI.sesMetin = e.target.value; });
document.addEventListener("change", e=>{
  const x=e.target;
  if(x.id==="dosya-fis"||x.id==="dosya-ambalaj"){ const f=x.files[0]; if(f) gorselIsle(f, x.id==="dosya-fis"?"fis":"ambalaj"); x.value=""; }
  else if(x.dataset.log){ const l=S.log.find(y=>y.id===x.dataset.log); if(l){ l.not=x.value; kaydet(); } }
  else if(x.id==="kiler"){ S.hane.kiler=x.value; kaydet(); }
});
yukle();
</script>
</body>
</html>
